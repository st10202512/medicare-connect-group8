<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — MediCare Connect</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js"></script>
</head>
<body onload="checkSession('admin'); displayUserEmail('user-email');">
  <header>
    <div class="container nav">
      <div class="logo">MediCare Connect</div>
      <nav>
        <a href="#" onclick="logout()" class="btn-outline">Logout</a>
      </nav>
    </div>
  </header>

  <section class="container page">
    <div class="dashboard-header">
      <h1>Admin Dashboard</h1>
      <p>Welcome, Admin (<span id="user-email"></span>)</p>
    </div>

    <div class="dashboard-grid">
      <div class="stat-card">
        <h2>15</h2>
        <p>Total Users</p>
      </div>
      <div class="stat-card">
        <h2>8</h2>
        <p>Pending Approvals</p>
      </div>
      <div class="stat-card">
        <h2>R5,250</h2>
        <p>Total Revenue</p>
      </div>
    </div>

    <h2 style="margin-bottom: 20px;">Pending Appointments</h2>
    
    <div class="list-item">
      <div>
        <strong>John Doe</strong><br>
        Consultation - 15 Nov at 09:00
      </div>
      <div>
        <button class="btn" style="padding: 8px 16px; font-size: 14px; background: #4CAF50; margin-right: 8px;">Approve</button>
        <button class="btn" style="padding: 8px 16px; font-size: 14px; background: #f44336;">Reject</button>
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 HealthyLife Family Clinic — MediCare Connect</p>
    </div>
  </footer>
</body>
</html>
