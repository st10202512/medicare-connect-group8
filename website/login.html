<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MediCare Connect</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container nav">
      <div class="logo">MediCare Connect</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html">Contact</a>
        <a href="login.html" class="btn-outline">Login</a>
      </nav>
    </div>
  </header>

  <section class="container page">
    <h1 style="text-align: center;">Sign in to your account</h1>

    <form class="auth-form" onsubmit="validateLogin(event)">
      <label>Email</label>
      <input type="email" id="login-email" required>

      <label>Password</label>
      <input type="password" id="login-password" required minlength="6">

      <label>Login As</label>
      <select id="login-role" required>
        <option value="patient">Patient</option>
        <option value="doctor">Doctor</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit" class="btn">Login</button>
    </form>
    <p id="login-msg" class="success-msg"></p>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 HealthyLife Family Clinic — MediCare Connect</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
